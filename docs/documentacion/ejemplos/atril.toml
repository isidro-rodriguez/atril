# atril.toml — configuración de la estación (por ejemplo, D:\Estudio\atril.toml).
# La raíz de la estación es la carpeta que contiene este fichero y el DEEPTUTOR_HOME;
# su estructura es fija: app\ (DeepTutor), data\ (datos de DT) y temarios\<id>\.

[deeptutor]
repo = "https://github.com/HKUDS/DeepTutor"   # por defecto
rama = "dev"                                  # por defecto
puertos = { backend = 8001, frontend = 3782 } # por defecto
python = "3.13"                               # por defecto
parches = ["paginas-citas", "arranque-sin-ventana"]  # parches incluidos en atril
paquetes = ["claude-agent-sdk>=0.2.174,<0.3"] # extra para el LLM claude_code
busqueda = "duckduckgo"                       # proveedor de búsqueda web de DT

[deeptutor.llm]    # opcional; solo proveedores sin clave en fichero (OAuth)
proveedor = "claude_code"
modelo = "claude-code/opus"

[ollama]
url = "http://localhost:11434"                # por defecto
embedding = "qwen3-embedding:8b"
dimension = 4096
contexto = 8192    # = OLLAMA_CONTEXT_LENGTH y ventana declarada en DeepTutor

[indexado]         # tabla opcional; estos son los valores por defecto
parser = "docling" # text_only | docling | mineru | markitdown | pymupdf4llm | ...
chunk = 1024
solape = 150
descargar_modelos = true  # permite a Docling/MinerU descargar sus modelos
hilos = 0          # hilos de CPU al indexar; 0 = sin límite (p. ej. la mitad de núcleos)
lote_embedding = 10   # fragmentos por petición de embedding (menos = ráfagas de GPU cortas)
pausa_embedding = 0   # ms mínimos entre peticiones de embedding; deja respirar a la GPU

[backup]
# Carpetas para las copias (un disco desconectado se salta; vale la de Google Drive).
destinos = ['E:\backups-atril', 'G:\Mi unidad\Backups\atril']
formato = "zip"   # "zip" (deflate 9) o "tar.xz" (xz 9: más compacto, bastante más lento)
conservar = 7     # copias que se guardan en cada destino; las más antiguas se borran

[atril]            # tabla opcional
buscar_actualizaciones = true  # al abrir la ventana, avisa si hay una versión nueva
