# zensical.toml
# Configuración del sitio web de atril (Zensical).
# Referencia: https://zensical.org/docs/setup/basics/
#
#   uv run zensical serve   # vista previa en http://localhost:8000 con recarga
#   uv run zensical build   # genera el sitio estático en site/

[project]
site_name = "Atril"
site_description = "Tu tutor con IA para estudiar tus propios apuntes, en tu ordenador: instala y cuida DeepTutor por ti."
site_author = "Isidro Rodríguez"
# GitHub Pages distingue mayúsculas en la ruta: debe coincidir con el nombre del repo.
site_url = "https://isidro-rodriguez.github.io/atril/"
repo_url = "https://github.com/isidro-rodriguez/atril"
repo_name = "isidro-rodriguez/atril"
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; 2026 Isidro Rodríguez · Licencia MIT"
docs_dir = "docs"
site_dir = "site"
extra_css = ["assets/stylesheets/atril.css"]

# Orden de lectura: primero la guía para todos, después la documentación técnica.
nav = [
    { "Inicio" = "index.md" },
    { "Guía" = [
        "guia/instalacion.md",
        "guia/primeros-pasos.md",
        "guia/ventana.md",
        "guia/preguntas.md",
    ] },
    { "Documentación" = [
        "documentacion/conceptos.md",
        "documentacion/cli.md",
        "documentacion/atril-toml.md",
        "documentacion/temario-toml.md",
        "documentacion/indexado.md",
        "documentacion/backups.md",
        "documentacion/instalador.md",
    ] },
    { "Desarrollo" = [
        "desarrollo/contribuir.md",
    ] },
]

[project.theme]
language = "es"
# Plantillas propias: favicons y manifiesto web (`docs_templates/main.html`).
custom_dir = "docs_templates"
favicon = "assets/images/favicon.png"
logo = "assets/images/logo.png"
# Inter es la tipografía de la ventana de atril.
font.text = "Inter"
font.code = "JetBrains Mono"
features = [
    "content.action.edit",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "toc.follow",
]

# Los colores reales (paleta de la ventana) están en `docs/assets/stylesheets/atril.css`.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun-moon"
toggle.name = "Cambiar a modo claro"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Cambiar a modo oscuro"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Cambiar a la preferencia del sistema"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/isidro-rodriguez/atril"
name = "Código fuente en GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/atril/"
name = "atril en PyPI"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
# Anclajes con tildes, igual que GitHub: los enlaces `#validación` funcionan en
# la web y al leer los .md en el repositorio.
toc.slugify = { object = "pymdownx.slugs.slugify", kwds = { case = "lower" } }
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# Los ejemplos de configuración se incluyen tal cual (`--8<--`): son los mismos
# ficheros que validan las pruebas.
pymdownx.snippets.base_path = ["docs"]
pymdownx.snippets.check_paths = true
pymdownx.superfences.custom_fences = [
    { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
