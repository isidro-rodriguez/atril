# zensical.toml
# Configuración del sitio web de atril (Zensical).
# Referencia: https://zensical.org/docs/setup/basics/
#
#   uv run zensical serve   # vista previa en http://localhost:8000 con recarga
#   uv run zensical build   # genera el sitio estático en site/

[project]
site_name = "Atril"
site_description = "Tu tutor con IA para estudiar tus propios apuntes, en tu ordenador: instala y cuida DeepTutor por ti."
site_author = "Isidro Rodríguez"
# GitHub Pages distingue mayúsculas en la ruta: debe coincidir con el nombre del repo.
site_url = "https://isidro-rodriguez.github.io/atril/"
repo_url = "https://github.com/isidro-rodriguez/atril"
repo_name = "isidro-rodriguez/atril"
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; 2026 Isidro Rodríguez · Licencia MIT"
docs_dir = "docs"
site_dir = "site"

# Orden de lectura: primero la guía para todos, después la documentación técnica.
nav = [
    { "Inicio" = "index.md" },
    { "Guía" = [
        "guia/instalacion.md",
        "guia/primeros-pasos.md",
        "guia/ventana.md",
        "guia/preguntas.md",
    ] },
    { "Documentación" = [
        "documentacion/conceptos.md",
        "documentacion/cli.md",
        "documentacion/atril-toml.md",
        "documentacion/temario-toml.md",
        "documentacion/indexado.md",
        "documentacion/backups.md",
        "documentacion/instalador.md",
    ] },
    { "Desarrollo" = [
        "desarrollo/contribuir.md",
    ] },
]

[project.theme]
# Tema común de las webs: https://isidro-rodriguez.github.io/techsical/
# Trae idioma, fuentes, funciones, paleta clara/oscura, favicons y manifiesto.
name = "techsical"
logo = "assets/images/logo.png"
features = [
    "content.action.edit",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.indexes",
    "navigation.path",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "toc.follow",
]

[project.extra.techsical]
# Azul de acento de la ventana (src/atril/gui/style.py), también en modo oscuro.
# Opciones: https://isidro-rodriguez.github.io/techsical/guia/personalizacion/
primary = "#0f5ec9"
primary_dark = "#79aefc"
accent = "#0f5ec9"
accent_dark = "#79aefc"
# Como la ventana: el contenido en un panel sobre un fondo gris azulado.
framed = true

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/isidro-rodriguez/atril"
name = "Código fuente en GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/atril/"
name = "atril en PyPI"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
# Anclajes con tildes, igual que GitHub: los enlaces `#validación` funcionan en
# la web y al leer los .md en el repositorio.
toc.slugify = { object = "pymdownx.slugs.slugify", kwds = { case = "lower" } }
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# Los ejemplos de configuración se incluyen tal cual (`--8<--`): son los mismos
# ficheros que validan las pruebas.
pymdownx.snippets.base_path = ["docs"]
pymdownx.snippets.check_paths = true
pymdownx.superfences.custom_fences = [
    { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
