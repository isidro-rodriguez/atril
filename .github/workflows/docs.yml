# .github/workflows/docs.yml
name: Docs

on:
  push:
    branches: [main]
    paths: &docs-paths
      - "docs/**"
      - "src/**"
      - "scripts/capturas.py"
      - "docs_templates/**"
      - "zensical.toml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths: *docs-paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Las capturas se hacen con la ventana real del mismo commit, en Windows (su
  # aspecto y sus rutas), con una estación de ejemplo: nunca se versionan.
  capturas:
    name: Capturas de la ventana
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Instalar uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.13"

      - name: Sincronizar dependencias
        run: uv sync --locked

      - name: Capturar la ventana
        run: uv run --with pillow python scripts/capturas.py docs/assets/images/capturas

      - name: Guardar las capturas
        uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: docs/assets/images/capturas/*.png
          if-no-files-found: error

  build:
    name: Documentación (Zensical)
    needs: capturas
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Instalar uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.13"

      - name: Sincronizar dependencias
        run: uv sync --locked

      - name: Recuperar las capturas
        uses: actions/download-artifact@v4
        with:
          name: capturas
          path: docs/assets/images/capturas

      # Una captura que falta o que la página no usa es un error, no una imagen rota.
      - name: Comprobar las capturas
        run: |
          used=$(grep -rhoE 'capturas/[a-z-]+\.png' docs | sort -u | sed 's|capturas/||')
          for name in $used; do
            test -f "docs/assets/images/capturas/$name" || { echo "Falta $name"; exit 1; }
          done

      - name: Construir documentación con Zensical
        run: uv run zensical build

      # Solo se publica desde main; en las pull requests basta con que compile.
      - name: Subir el sitio como artefacto de Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Publicar en GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v5
