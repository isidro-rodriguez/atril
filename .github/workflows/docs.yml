# .github/workflows/docs.yml
name: Docs

# La web se publica con cada versión de atril: publish.yml llama a este workflow
# con el tag recién creado, y las capturas se generan con el código de ese tag.
# A mano solo se puede rehacer la de un tag ya publicado (mismo proceso, nada
# guardado de antes). Las capturas nunca se versionan ni se reutilizan.
on:
  workflow_call:
    inputs:
      tag:
        description: Tag de la versión publicada (vX.Y.Z)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Tag de una versión publicada (vX.Y.Z)
        required: true
        type: string

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Las capturas se hacen con la ventana real de la versión, en Windows (su aspecto
  # y sus rutas), con una estación de ejemplo. Si el script falla, no hay web nueva.
  capturas:
    name: Capturas de la ventana (${{ inputs.tag }})
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Instalar uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.13"

      - name: Sincronizar dependencias
        run: uv sync --locked

      - name: Comprobar que el tag es la versión del código
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version=$(uv run python -c "import atril; print(atril.__version__)")
          test "v$version" = "$TAG" || { echo "$TAG no es v$version"; exit 1; }

      # Fuera del repositorio: el script las valida antes de dejarlas ahí.
      - name: Capturar la ventana
        run: uv run --with pillow python scripts/capturas.py "${{ runner.temp }}/capturas"

      - name: Guardar las capturas
        uses: actions/upload-artifact@v4
        with:
          name: capturas-${{ inputs.tag }}
          path: ${{ runner.temp }}/capturas/*.png
          if-no-files-found: error
          retention-days: 1

  build:
    name: Documentación (Zensical)
    needs: capturas
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Instalar uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.13"

      - name: Sincronizar dependencias
        run: uv sync --locked

      - name: Recuperar las capturas
        uses: actions/download-artifact@v4
        with:
          name: capturas-${{ inputs.tag }}
          path: docs/assets/images/capturas

      # Una captura que falta es un error, no una imagen rota en la web.
      - name: Comprobar las capturas
        run: |
          used=$(grep -rhoE 'capturas/[a-z-]+\.png' docs | sort -u | sed 's|capturas/||')
          for name in $used; do
            test -f "docs/assets/images/capturas/$name" || { echo "Falta $name"; exit 1; }
          done

      - name: Construir documentación con Zensical
        run: uv run zensical build

      - name: Subir el sitio como artefacto de Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Publicar en GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v5
