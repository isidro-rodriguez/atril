name: Publish atril to PyPI

# Se publica al subir a main un cambio en el paquete. La versión sale de
# `pyproject.toml`; si ya existe el tag `vX.Y.Z` no se vuelve a publicar.
on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'pyproject.toml'
      - 'README.md'
      - 'LICENSE'
  workflow_dispatch: { }

concurrency:
  group: publish-atril
  cancel-in-progress: false

jobs:
  check:
    name: Comprobar versión
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      exists: ${{ steps.meta.outputs.exists }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Leer versión y comprobar si ya está publicada
        id: meta
        run: |
          set -euo pipefail
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          TAG="v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null 2>&1; then
            EXISTS=true
            echo "::warning::${TAG} ya existe: si has cambiado atril, sube la versión en pyproject.toml."
          else
            EXISTS=false
          fi
          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "exists=${EXISTS}"
          } >> "$GITHUB_OUTPUT"

  publish:
    name: Construir y publicar atril ${{ needs.check.outputs.version }}
    needs: check
    if: needs.check.outputs.exists == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write # crear tag y release
      id-token: write # publicación de confianza en PyPI (OIDC), sin token

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Instalar uv y Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'

      - name: Sincronizar dependencias
        run: uv sync --locked

      - name: Comprobaciones de calidad
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run ty check --error-on-warning
          uv run pytest

      - name: Construir atril
        run: uv build

      - name: Comprobar metadatos
        run: uvx twine check dist/*

      # Trusted publisher configurado en PyPI para este repo y este workflow.
      - name: Publicar en PyPI
        run: uv publish --trusted-publishing always dist/*

      - name: Crear tag y release en GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.check.outputs.tag }}" dist/* \
            --target "${GITHUB_SHA}" \
            --title "atril ${{ needs.check.outputs.version }}" \
            --generate-notes

  # La web de esta versión, con capturas hechas con su código (docs.yml).
  docs:
    name: Web
    needs: [ check, publish ]
    if: needs.publish.result == 'success'
    uses: ./.github/workflows/docs.yml
    with:
      tag: ${{ needs.check.outputs.tag }}
    permissions:
      contents: read
      pages: write
      id-token: write

  installer:
    name: Instalador de Windows ${{ needs.check.outputs.version }}
    needs: [ check, publish ]
    # Tras publicar; a mano (workflow_dispatch) rehace el de una versión ya publicada.
    if: >-
      always() && needs.check.result == 'success' &&
      (needs.publish.result == 'success' ||
       (needs.publish.result == 'skipped' && github.event_name == 'workflow_dispatch'))
    runs-on: windows-latest
    permissions:
      contents: write # adjuntar el instalador a la release
    env:
      VERSION: ${{ needs.check.outputs.version }}
      TAG: ${{ needs.check.outputs.tag }}
      UV_VERSION: '0.13.7'
      UV_SHA256: '0cdc5b38fe5a8168ed6a25814f5ba43c21d313dd3187314fccb37b7cec46e021'
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Descargar uv.exe (versión fija y suma comprobada)
        run: |
          $zip = "uv.zip"
          Invoke-WebRequest "https://github.com/astral-sh/uv/releases/download/$env:UV_VERSION/uv-x86_64-pc-windows-msvc.zip" -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:UV_SHA256) { throw "uv.zip: suma SHA-256 inesperada ($hash)" }
          Expand-Archive $zip -DestinationPath uv-bin
          if (-not (Test-Path uv-bin\uv.exe)) { throw "uv.zip no trae uv.exe" }

      - name: Instalar Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Construir el instalador
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" "/DSourceDir=$PWD\uv-bin" instalador\atril.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC ha fallado" }

      - name: Esperar a que PyPI sirva la versión
        # Se pregunta al propio uv: la API JSON y el índice HTML de PyPI pueden servir
        # ya la versión cuando la variante JSON del índice que pide uv aún no.
        run: |
          for ($i = 0; $i -lt 40; $i++) {
            & uv-bin\uv.exe tool run --no-cache --isolated --from "atril==$env:VERSION" atril --version
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds 15
          }
          throw "uv no encuentra atril $env:VERSION en PyPI"

      - name: Probar instalación y desinstalación
        run: |
          $setup = "dist\atril-$env:VERSION-setup.exe"
          $app = "$env:LOCALAPPDATA\Programs\Atril"
          Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/LOG=instalar.log' -Wait
          if (Test-Path "$app\instalacion.log") { Get-Content "$app\instalacion.log" }
          $version = & "$app\bin\atril.exe" --version
          Write-Output $version
          if ("$version" -notmatch [regex]::Escape($env:VERSION)) { throw "atril --version: $version" }
          if (-not (Test-Path "$app\bin\atril-gui.exe")) { throw "falta atril-gui.exe" }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Atril.lnk")) { throw "falta el acceso directo" }
          $path = (Get-ItemProperty HKCU:\Environment).Path
          if ($path -notlike "*$app\bin*") { throw "bin no está en el PATH del usuario" }
          # Actualización desde la ventana: un Python del entorno sigue vivo (ficheros en
          # uso) y el instalador debe esperar a que termine (/esperar) antes de usar uv.
          # Entorno de una versión anterior (diseño de antes de 0.34.0): se borra al actualizar.
          New-Item -ItemType Directory "$app\herramientas\atril\Lib" -Force | Out-Null
          $busy = Start-Process "$app\herramientas\$env:VERSION\atril\Scripts\python.exe" -ArgumentList '-c', '"import psutil, time; time.sleep(20)"' -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 3
          Start-Process $setup -ArgumentList '/SILENT', '/SP-', '/SUPPRESSMSGBOXES', "/esperar=$($busy.Id)", '/LOG=actualizar.log' -Wait
          Get-Content "$app\instalacion.log"
          $version = & "$app\bin\atril.exe" --version
          if ("$version" -notmatch [regex]::Escape($env:VERSION)) { throw "tras actualizar, atril --version: $version" }
          if (Test-Path "$app\herramientas\atril") { throw "no se ha borrado el entorno anterior" }
          Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES' -Wait
          Start-Sleep -Seconds 5  # el desinstalador se relanza desde una copia temporal
          if (Test-Path "$app\bin") { throw "la desinstalación ha dejado $app\bin" }
          $path = (Get-ItemProperty HKCU:\Environment).Path
          if ($path -like "*$app\bin*") { throw "la desinstalación ha dejado bin en el PATH" }

      - name: Adjuntar a la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload $env:TAG "dist\atril-$env:VERSION-setup.exe" --clobber

      - name: Reunir los registros si falla
        if: failure()
        run: |
          New-Item -ItemType Directory registros -Force | Out-Null
          Copy-Item instalar.log, actualizar.log, "$env:LOCALAPPDATA\Programs\Atril\instalacion.log" registros -ErrorAction SilentlyContinue

      - name: Guardar los registros si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: registros-instalador
          path: registros
          if-no-files-found: ignore
